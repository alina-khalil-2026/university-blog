<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Text Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Interactive Text Editor</h1>
        <p>Click buttons to change the text appearance.</p>

        <div class="toolbar">
            <button id="red">Red Text</button>
            <button id="blue">Blue Text</button>
            <button id="green">Green Text</button>

            <button id="increase">A+</button>
            <button id="decrease">A-</button>

            <select id="fontFamily">
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier New</option>
            </select>

            <button id="underline">Underline</button>
            <button id="overline">Overline</button>
            <button id="strike">Line Through</button>

            <button id="bold">Bold</button>
            <button id="italic">Italic</button>

            <button id="left">Left</button>
            <button id="center">Center</button>
            <button id="right">Right</button>

            <button id="upper">Uppercase</button>
            <button id="lower">Lowercase</button>

            <button id="pink">Pink Background</button>
            <button id="yellow">Yellow Background</button>

            <button id="mode">Dark / Light Mode</button>
            <button id="reset">Reset</button>
        </div>

        <div id="textArea" contenteditable="true">
            Welcome to my Interactive Text Editor!
            You can change my color, size, font, and style.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
